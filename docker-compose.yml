services:
  crowdqueue:
    build: .
    container_name: crowdqueue
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - crowdqueue_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true

volumes:
  crowdqueue_data:
